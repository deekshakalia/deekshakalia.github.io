<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1572"/>
      <stop offset="100%" style="stop-color:#6b21a8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Accent glow blob left -->
  <ellipse cx="100" cy="200" rx="220" ry="180" fill="#a855f7" fill-opacity="0.12"/>
  <!-- Accent glow blob right -->
  <ellipse cx="1100" cy="200" rx="200" ry="160" fill="#a855f7" fill-opacity="0.10"/>

  <!-- Decorative circles -->
  <circle cx="980" cy="80" r="120" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="980" cy="80" r="80" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="220" cy="330" r="90" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ISO badge icon area -->
  <rect x="180" y="130" width="80" height="80" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="220" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a855f7" fill-opacity="0.9" text-anchor="middle" letter-spacing="1">ISO/IEC</text>
  <text x="220" y="182" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">42001</text>
  <text x="220" y="198" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.6" text-anchor="middle" letter-spacing="1">2023</text>

  <!-- Main title -->
  <text x="300" y="178" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">ISO/IEC 42001</text>
  <text x="300" y="232" font-family="Georgia, serif" font-size="28" fill="#e9d5ff" letter-spacing="0">What It Means for Pharma</text>
  <text x="300" y="270" font-family="Georgia, serif" font-size="28" fill="#e9d5ff" letter-spacing="0">&amp; MedTech Companies</text>

  <!-- Divider line -->
  <rect x="300" y="294" width="60" height="3" rx="2" fill="#a855f7"/>

  <!-- Subtitle tags -->
  <rect x="300" y="314" width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.1"/>
  <text x="365" y="331" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle" letter-spacing="0.5">AI Governance</text>

  <rect x="442" y="314" width="150" height="24" rx="12" fill="#ffffff" fill-opacity="0.1"/>
  <text x="517" y="331" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle" letter-spacing="0.5">Regulatory Affairs</text>

  <rect x="604" y="314" width="120" height="24" rx="12" fill="#ffffff" fill-opacity="0.1"/>
  <text x="664" y="331" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle" letter-spacing="0.5">Patient Safety</text>

  <!-- Right side: AI/pharma icon group -->
  <!-- Molecule-style decorative nodes -->
  <circle cx="950" cy="220" r="18" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1010" cy="170" r="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="1060" cy="240" r="20" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1000" cy="290" r="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="1090" cy="160" r="10" fill="#ffffff" fill-opacity="0.1" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="950" y1="220" x2="1010" y2="170" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1010" y1="170" x2="1060" y2="240" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1060" y1="240" x2="1000" y2="290" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="950" y1="220" x2="1000" y2="290" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="1010" y1="170" x2="1090" y2="160" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1"/>
</svg>
