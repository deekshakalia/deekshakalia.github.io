<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/playfair-display.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
  <title>{% if page.title and page.title != site.title %}Deeksha Kalia | {{ page.title }}{% else %}Deeksha Kalia{% endif %}</title>
  {% seo %}

</head>

<body class='page {{layout.bodyClass}}'>
  <a href="#main-content" class="skip-link">Skip to content</a>
  {% include main-menu-mobile.html %}
  <div id="main-content" class="wrapper">
    {% include header.html headerClass='header-extra' %}
    {{content}}
  </div>
  {% include sub-footer.html %}
  <script>window.GITHUB_TOKEN = "{{ site.github_contact_token }}"; window.GITHUB_REPO = "{{ site.github_contact_repo }}";</script>
  <script defer src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
  {% include google-analytics.html %}

  <!-- Chat Widget -->
  <div id="chat-widget">
    <button id="chat-fab" aria-label="Open chat">
      <svg id="chat-fab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <svg id="chat-fab-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="chat-modal">
      <div id="chat-modal-header">
        <span>💬 Chat with me</span>
        <button id="chat-minimize" aria-label="Minimize chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="chat-send" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </div>
</body>
</html>
