baseurl: '/'
url: 'https://deekshakalia.github.io'
permalink: pretty
title: 'Deeksha Kalia'
description: 'Regulatory Affairs Professional — Pharmacovigilance, Medical Devices, AI Regulatory Strategy'
author: 'Deeksha Kalia'
logo: /images/logo/logo.svg
social:
  name: Deeksha Kalia
  links:
    - https://www.linkedin.com/in/dr-deeksha-kalia/

home:
  limit_services: 6

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: false

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"

sass:
  style: compressed # possible values: nested expanded compact compressed

# GitHub token and repo for the chatbot contact widget on the homepage.
# When a visitor completes the chat, their message is posted to the GitHub Issues API,
# creating a private issue in the repo below.
# The token is injected at deploy time from the GitHub Actions secret.
github_contact_token: ""
github_contact_repo: "deekshakalia/deekshakalia.github.io-contact"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
