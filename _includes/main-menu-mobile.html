<div id="main-menu-mobile" class="main-menu-mobile">
  {% assign mainmenu = site.data.menus.main | sort: 'weight'  %}
  <ul>
    {% for item in mainmenu %}
    <li class="{% if item.url == page.url or (page.layout == 'post' and item.name == 'Blog') %}active{% endif %}">
      <a href="{{ item.url | relative_url }}"{% if item.url == page.url or (page.layout == 'post' and item.name == 'Blog') %} aria-current="page"{% endif %}>{{ item.name }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
